<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="cs">
<head th:replace="~{fragments/layout :: head('Přihlášení')}"></head>
<body>

<div class="rk-app">
    <div class="rk-auth">
        <div class="rk-auth__card">
            <div class="rk-auth__brand">
                <span style="display:inline-flex; align-items:center; gap:10px;">
                    <span class="rk-brand__mark" style="width:32px; height:32px; font-size:18px;">R</span>
                    Ragnarok
                </span>
                <span class="sub">Training Diary · osobní + skupinové tréninky</span>
            </div>

            <div class="rk-card">
                <div class="rk-card__body">
                    <h2 style="font-size:var(--fs-h2); margin-bottom: var(--sp-2);">Přihlášení</h2>
                    <p class="text-muted" style="margin-bottom: var(--sp-5); font-size: var(--fs-sm);">
                        Vítej zpátky. Zadej email a heslo.
                    </p>

                    <div th:if="${param.error}" class="alert alert-danger">Neplatný email nebo heslo.</div>
                    <div th:if="${param.logout}" class="alert alert-info">Byl jsi odhlášen.</div>
                    <div th:if="${param.registered}" class="alert alert-success">Účet vytvořen, můžeš se přihlásit.</div>

                    <form th:action="@{/login}" method="post" class="rk-stack-4">
                        <div class="rk-field">
                            <label class="rk-label" for="username">Email</label>
                            <input class="form-control" id="username" name="username" type="email"
                                   placeholder="marek@example.cz" autocomplete="email" required autofocus>
                        </div>
                        <div class="rk-field">
                            <div class="d-flex justify-content-between align-items-baseline">
                                <label class="rk-label" for="password">Heslo</label>
                            </div>
                            <input class="form-control" id="password" name="password" type="password"
                                   placeholder="••••••••" autocomplete="current-password" required>
                        </div>
                        <button class="btn btn-accent btn-lg btn-block" type="submit">Přihlásit se</button>
                    </form>

                    <hr>
                    <p class="text-center text-muted" style="font-size: var(--fs-sm); margin: 0;">
                        Ještě nemáš účet?
                        <a th:href="@{/register}" style="color: var(--rk-primary); font-weight: 600;">Zaregistruj se</a>
                    </p>
                </div>
            </div>

            <p class="text-center text-muted" style="font-size: var(--fs-xs); margin-top: var(--sp-4);">
                Ragnarok Training Diary ·
                <span th:text="${#dates.format(#dates.createNow(), 'yyyy')}">2026</span>
            </p>
        </div>
    </div>
</div>

<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
