<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="cs">
<head th:replace="~{fragments/layout :: head('Přihlášení')}"></head>
<body class="d-flex flex-column min-vh-100">

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container py-5 flex-grow-1">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-4">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h3 class="card-title mb-4">Přihlášení</h3>

                    <div th:if="${param.error}" class="alert alert-danger" role="alert">
                        Neplatný email nebo heslo.
                    </div>
                    <div th:if="${param.logout}" class="alert alert-info" role="alert">
                        Byl jsi odhlášen.
                    </div>
                    <div th:if="${param.registered}" class="alert alert-success" role="alert">
                        Účet vytvořen, můžeš se přihlásit.
                    </div>

                    <form th:action="@{/login}" method="post">
                        <div class="mb-3">
                            <label for="username" class="form-label">Email</label>
                            <input type="email" id="username" name="username" class="form-control" required autofocus>
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label">Heslo</label>
                            <input type="password" id="password" name="password" class="form-control" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Přihlásit</button>
                    </form>

                    <p class="mt-3 text-center small">
                        Ještě nemáš účet? <a th:href="@{/register}">Zaregistruj se.</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<div th:replace="~{fragments/layout :: scripts}"></div>

</body>
</html>
