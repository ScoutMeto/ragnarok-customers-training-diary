<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="cs">
<head th:replace="~{fragments/layout :: head('Nastavení nového hesla')}"></head>
<body>

<div class="rk-app">
    <div class="rk-auth">
        <div class="rk-auth__card">
            <div class="rk-auth__brand">
                <span style="display:inline-flex; align-items:center; gap:10px;">
                    <img th:src="@{/images/ragnarok-logo.png}" alt="Ragnarok" style="height:40px; width:auto;">
                    Ragnarok
                </span>
                <span class="sub">Nové heslo</span>
            </div>

            <div class="rk-card">
                <div class="rk-card__body">
                    <h2 style="font-size: var(--fs-h2); margin-bottom: var(--sp-2);">🔒 Nastav nové heslo</h2>
                    <p class="text-muted" style="margin-bottom: var(--sp-5); font-size: var(--fs-sm);">
                        Zadej <strong>6místný kód</strong> z emailu a zvol si nové heslo.
                    </p>

                    <div th:if="${flashSuccess}" class="alert alert-success" th:text="${flashSuccess}"></div>
                    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

                    <form th:action="@{/reset-password}" method="post" class="rk-stack-4">
                        <div class="rk-field">
                            <label class="rk-label" for="email">Email</label>
                            <input class="form-control" id="email" name="email" type="email"
                                   th:value="${email}" required autocomplete="email">
                        </div>
                        <div class="rk-field">
                            <label class="rk-label" for="code">Kód z emailu <span class="req">*</span></label>
                            <input class="form-control num" id="code" name="code" type="text"
                                   placeholder="123456" required maxlength="8"
                                   autocomplete="one-time-code" inputmode="numeric" pattern="[0-9]{6}"
                                   style="font-size: var(--fs-h2); letter-spacing: 0.3em; text-align: center;">
                            <p class="rk-help">6 číslic. Kód platí 60 minut.</p>
                        </div>
                        <div class="rk-field">
                            <label class="rk-label" for="password">Nové heslo <span class="req">*</span></label>
                            <input class="form-control" id="password" name="password" type="password"
                                   placeholder="••••••••" required minlength="8" autocomplete="new-password">
                            <p class="rk-help">Aspoň 8 znaků.</p>
                        </div>
                        <div class="rk-field">
                            <label class="rk-label" for="passwordConfirm">Heslo znovu <span class="req">*</span></label>
                            <input class="form-control" id="passwordConfirm" name="passwordConfirm" type="password"
                                   placeholder="••••••••" required minlength="8" autocomplete="new-password">
                        </div>
                        <button class="btn btn-accent btn-lg btn-block" type="submit">Uložit nové heslo</button>
                    </form>

                    <hr>
                    <p class="text-center text-muted" style="font-size: var(--fs-sm); margin: 0;">
                        Nedorazil kód?
                        <a th:href="@{/forgot-password}" style="color: var(--rk-primary); font-weight: 600;">Poslat znovu</a>
                        · <a th:href="@{/login}" style="color: var(--rk-primary); font-weight: 600;">Přihlášení</a>
                    </p>
                </div>
            </div>

            <p class="text-center text-muted" style="font-size: var(--fs-xs); margin-top: var(--sp-4);">
                Ragnarok Training Diary ·
                <span th:text="${#dates.format(#dates.createNow(), 'yyyy')}">2026</span>
            </p>
        </div>
    </div>
</div>

<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
