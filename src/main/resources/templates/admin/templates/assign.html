<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="cs">
<head th:replace="~{fragments/layout :: head('Přiřadit šablonu')}"></head>
<body class="d-flex flex-column min-vh-100">

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container py-4 flex-grow-1">

    <nav aria-label="breadcrumb" class="mb-3">
        <ol class="breadcrumb mb-0">
            <li class="breadcrumb-item">Admin</li>
            <li class="breadcrumb-item"><a th:href="@{/admin/training-templates}">Šablony</a></li>
            <li class="breadcrumb-item active">Přiřadit</li>
        </ol>
    </nav>

    <h1 class="mb-3">📤 Přiřadit šablonu klientovi</h1>

    <div class="card mb-4">
        <div class="card-body">
            <h5 class="mb-2" th:text="${template.name} ?: 'Šablona'">Název šablony</h5>
            <p class="text-muted mb-0">
                <span th:text="${template.exercises.size()}">3</span> cviků
                <span th:if="${template.notes != null and !template.notes.isEmpty()}">
                    · <span th:text="${template.notes}">poznámka</span>
                </span>
            </p>
        </div>
    </div>

    <form th:action="@{/admin/training-templates/{id}/assign(id=${template.id})}" method="post">

        <div class="card mb-4">
            <div class="card-body">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label for="clientId" class="form-label">Klient *</label>
                        <select id="clientId" name="clientId" class="form-select" required>
                            <option value="">— vyber klienta —</option>
                            <option th:each="c : ${clients}" th:value="${c.id}"
                                    th:text="${c.firstName} + ' ' + ${c.lastName} + ' <' + ${c.email} + '>'">Klient</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label for="trainingDate" class="form-label">Datum tréninku *</label>
                        <input type="date" id="trainingDate" name="trainingDate"
                               th:value="${defaultDate}" class="form-control" required>
                    </div>
                </div>
                <p class="text-muted small mt-3 mb-0">
                    Po potvrzení vznikne klientovi v deníku PRIVATE trénink se stejnými cviky jako šablona.
                    Klient si pak doplní vlastní váhy / opakování / RPE / poznámky.
                </p>
            </div>
        </div>

        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">📤 Přiřadit</button>
            <a th:href="@{/admin/training-templates}" class="btn btn-outline-secondary">Zrušit</a>
        </div>
    </form>

</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<div th:replace="~{fragments/layout :: scripts}"></div>

</body>
</html>
