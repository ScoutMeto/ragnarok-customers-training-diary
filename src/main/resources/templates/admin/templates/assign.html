<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="cs">
<head th:replace="~{fragments/layout :: head('Přiřadit šablonu')}"></head>
<body>

<nav th:replace="~{fragments/layout :: navbar('admin-templates')}"></nav>

<main class="rk-page">

    <div class="rk-crumb">
        <span>Admin</span>
        <span class="sep">/</span>
        <a th:href="@{/admin/training-templates}">Šablony</a>
        <span class="sep">/</span>
        <span class="current">Přiřadit</span>
    </div>

    <div class="rk-page__head">
        <div>
            <h1 class="rk-page__title">📤 Přiřadit šablonu klientovi</h1>
        </div>
    </div>

    <div class="rk-card" style="margin-bottom: var(--sp-4);">
        <div class="rk-card__body">
            <h3 style="font-size: var(--fs-h3); margin-bottom: 6px;" th:text="${template.name} ?: 'Šablona'">Název šablony</h3>
            <p class="text-muted" style="margin: 0; font-size: var(--fs-sm);">
                <span class="num" th:text="${template.exercises.size()}">3</span> cviků
                <span th:if="${template.notes != null and !template.notes.isEmpty()}">
                    · <span th:text="${template.notes}">poznámka</span>
                </span>
            </p>
        </div>
    </div>

    <form th:action="@{/admin/training-templates/{id}/assign(id=${template.id})}" method="post">

        <div class="rk-card" style="margin-bottom: var(--sp-4);">
            <div class="rk-card__body">
                <div class="row g-3">
                    <div class="col-md-6">
                        <div class="rk-field">
                            <label class="rk-label" for="clientId">Klient <span class="req">*</span></label>
                            <select id="clientId" name="clientId" class="form-select" required>
                                <option value="">— vyber klienta —</option>
                                <option th:each="c : ${clients}" th:value="${c.id}"
                                        th:text="${c.firstName + ' ' + c.lastName + ' <' + c.email + '>'}">Klient</option>
                            </select>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="rk-field">
                            <label class="rk-label" for="trainingDate">Datum tréninku <span class="req">*</span></label>
                            <input type="date" id="trainingDate" name="trainingDate"
                                   th:value="${defaultDate}" class="form-control num" required>
                        </div>
                    </div>
                </div>
                <p class="rk-help" style="margin-top: var(--sp-3);">
                    Po potvrzení vznikne klientovi v deníku PRIVATE trénink se stejnými cviky jako šablona.
                    Klient si pak doplní vlastní váhy / opakování / RPE / poznámky.
                </p>
            </div>
        </div>

        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-accent">📤 Přiřadit</button>
            <a th:href="@{/admin/training-templates}" class="btn btn-outline">Zrušit</a>
        </div>
    </form>

</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<div th:replace="~{fragments/layout :: scripts}"></div>

</body>
</html>
