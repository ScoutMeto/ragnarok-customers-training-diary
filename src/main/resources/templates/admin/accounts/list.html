<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="cs">
<head th:replace="~{fragments/layout :: head('Admin: účty')}"></head>
<body>

<nav th:replace="~{fragments/layout :: navbar('admin-accounts')}"></nav>

<main class="rk-page">

    <div class="rk-crumb">
        <span>Admin</span>
        <span class="sep">/</span>
        <span class="current">Účty</span>
    </div>

    <div class="rk-page__head">
        <div>
            <h1 class="rk-page__title">Účty</h1>
            <p class="rk-page__sub">
                <span class="num" th:text="${accounts.size()}">0</span> aktivních účtů
            </p>
        </div>
        <div class="rk-page__actions">
            <a th:href="@{/admin/accounts/new}" class="btn btn-accent btn-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="16" height="16"><path d="M12 5v14M5 12h14"/></svg>
                Nový účet
            </a>
        </div>
    </div>

    <div th:if="${flashSuccess}" class="alert alert-success" th:text="${flashSuccess}"></div>
    <div th:if="${flashError}"   class="alert alert-danger"  th:text="${flashError}"></div>

    <div th:if="${accounts.isEmpty()}" class="rk-empty rk-card">
        <h3>Zatím žádné účty</h3>
        <p>Vytvoř první klientský účet.</p>
    </div>

    <table class="rk-table" th:unless="${accounts.isEmpty()}">
        <thead>
        <tr>
            <th>Jméno</th>
            <th>Email</th>
            <th>Telefon</th>
            <th>Role</th>
            <th>Vytvořen</th>
            <th></th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="a : ${accounts}">
            <td>
                <div style="display:flex; align-items:center; gap:10px;">
                    <div class="rk-avatar" style="width:28px;height:28px;background:var(--rk-ink);"
                         th:text="${#strings.toUpperCase(#strings.substring(a.firstName, 0, 1))} + ${#strings.toUpperCase(#strings.substring(a.lastName, 0, 1))}">MK</div>
                    <div>
                        <a th:href="@{/admin/accounts/{id}(id=${a.id})}"
                           style="color: var(--rk-ink); font-weight: 600;"
                           th:text="${a.lastName + ' ' + a.firstName}">Příjmení Jméno</a>
                        <span class="text-muted" style="margin-left: 4px;" th:text="'(' + ${a.nickname} + ')'">(nick)</span>
                    </div>
                </div>
            </td>
            <td class="text-muted" th:text="${a.email}">x@y.cz</td>
            <td class="text-muted" th:text="${a.phone} ?: '—'">—</td>
            <td>
                <span th:class="|rk-badge ${a.role.name() == 'ADMIN' ? 'rk-badge--accent' : ''}|"
                      th:text="${a.role}">USER</span>
            </td>
            <td class="num text-muted" th:text="${#temporals.format(a.createdAt, 'dd.MM.yyyy')}">23.05.2026</td>
            <td class="text-end">
                <a th:href="@{/admin/accounts/{id}(id=${a.id})}" class="btn btn-ghost btn-sm">Detail</a>
                <a th:href="@{/admin/accounts/{id}/edit(id=${a.id})}" class="btn btn-outline btn-sm">Upravit</a>
            </td>
        </tr>
        </tbody>
    </table>

</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<div th:replace="~{fragments/layout :: scripts}"></div>

</body>
</html>
