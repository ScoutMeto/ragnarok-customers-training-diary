<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="cs">
<head th:replace="~{fragments/layout :: head('Admin: účty')}"></head>
<body class="d-flex flex-column min-vh-100">

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container py-4 flex-grow-1">

    <nav aria-label="breadcrumb" class="mb-3">
        <ol class="breadcrumb mb-0">
            <li class="breadcrumb-item">Admin</li>
            <li class="breadcrumb-item active" aria-current="page">Účty</li>
        </ol>
    </nav>

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="mb-0">Účty</h1>
        <a th:href="@{/admin/accounts/new}" class="btn btn-primary">+ Nový účet</a>
    </div>

    <div th:if="${flashSuccess}" class="alert alert-success" th:text="${flashSuccess}"></div>
    <div th:if="${flashError}"   class="alert alert-danger"  th:text="${flashError}"></div>

    <table class="table align-middle">
        <thead>
        <tr>
            <th>Jméno</th>
            <th>Email</th>
            <th>Telefon</th>
            <th>Role</th>
            <th>Vytvořen</th>
            <th></th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="a : ${accounts}">
            <td>
                <a th:href="@{/admin/accounts/{id}(id=${a.id})}" th:text="${a.lastName} + ' ' + ${a.firstName}">Příjmení Jméno</a>
                <span class="text-muted small ms-1" th:text="'(' + ${a.nickname} + ')'">(nickname)</span>
            </td>
            <td th:text="${a.email}">x@y.cz</td>
            <td th:text="${a.phone} ?: '—'">—</td>
            <td>
                <span class="badge"
                      th:classappend="${a.role.name() == 'ADMIN'} ? 'bg-warning text-dark' : 'bg-secondary'"
                      th:text="${a.role}">USER</span>
            </td>
            <td>
                <span th:text="${#temporals.format(a.createdAt, 'dd.MM.yyyy')}">23.05.2026</span>
            </td>
            <td class="text-end">
                <a th:href="@{/admin/accounts/{id}/edit(id=${a.id})}" class="btn btn-sm btn-outline-primary">Upravit</a>
            </td>
        </tr>
        </tbody>
    </table>

    <p class="text-muted small" th:if="${accounts.isEmpty()}">Žádné aktivní účty.</p>

</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<div th:replace="~{fragments/layout :: scripts}"></div>

</body>
</html>
