<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="cs">
<head th:replace="~{fragments/layout :: head('Admin: účet')}"></head>
<body class="d-flex flex-column min-vh-100">

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container py-4 flex-grow-1">

    <nav aria-label="breadcrumb" class="mb-3">
        <ol class="breadcrumb mb-0">
            <li class="breadcrumb-item">Admin</li>
            <li class="breadcrumb-item"><a th:href="@{/admin/accounts}">Účty</a></li>
            <li class="breadcrumb-item active" aria-current="page"
                th:text="${account.lastName} + ' ' + ${account.firstName}">Příjmení Jméno</li>
        </ol>
    </nav>

    <div th:if="${flashSuccess}" class="alert alert-success" th:text="${flashSuccess}"></div>

    <div class="card mb-4">
        <div class="card-body">
            <div class="d-flex justify-content-between align-items-start mb-3">
                <div>
                    <h1 class="mb-1">
                        <span th:text="${account.firstName} + ' ' + ${account.lastName}">Jméno Příjmení</span>
                        <small class="text-muted" th:text="'(' + ${account.nickname} + ')'">(nick)</small>
                    </h1>
                    <p class="text-muted mb-0">
                        <strong>Email:</strong> <span th:text="${account.email}">x@y.cz</span><br>
                        <strong>Telefon:</strong> <span th:text="${account.phone} ?: '—'">—</span><br>
                        <strong>Role:</strong>
                        <span class="badge"
                              th:classappend="${account.role.name() == 'ADMIN'} ? 'bg-warning text-dark' : 'bg-secondary'"
                              th:text="${account.role}">USER</span><br>
                        <strong>Vytvořen:</strong>
                        <span th:text="${#temporals.format(account.createdAt, 'dd.MM.yyyy HH:mm')}">23.05.2026 10:00</span>
                    </p>
                </div>
                <div class="d-flex gap-2">
                    <a th:if="${account.role.name() == 'USER'}"
                       th:href="@{/admin/accounts/{id}/coach-plans(id=${account.id})}"
                       class="btn btn-outline-success btn-sm">📋 Plány od trenéra</a>
                    <a th:href="@{/admin/accounts/{id}/edit(id=${account.id})}" class="btn btn-outline-primary btn-sm">Upravit</a>
                    <form th:action="@{/admin/accounts/{id}/delete(id=${account.id})}" method="post" class="d-inline"
                          onsubmit="return confirm('Opravdu anonymizovat tento účet? Tréninky zůstanou v DB ale účet se nesmí přihlásit.');">
                        <button type="submit" class="btn btn-outline-danger btn-sm">Anonymizovat</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <h3 class="mb-3">Deník (<span th:text="${trainings.size()}">0</span>)</h3>

    <div th:if="${trainings.isEmpty()}" class="text-muted">
        Tento klient zatím nemá žádné tréninky.
    </div>

    <div th:unless="${trainings.isEmpty()}" class="row g-3">
        <div th:each="t : ${trainings}" class="col-md-6 col-lg-4">
            <a th:href="@{/diary/{id}(id=${t.id})}" class="text-decoration-none text-dark">
                <div class="card h-100 training-card">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-start mb-2">
                            <h5 class="card-title mb-0" th:text="${t.name} ?: 'Trénink'">Trénink</h5>
                            <span class="badge bg-secondary"
                                  th:text="${#temporals.format(t.trainingDate, 'dd.MM.yyyy')}">23.05.2026</span>
                        </div>
                        <p class="text-muted small mb-0">
                            <span th:text="${t.exercises.size()}">3</span> cviků
                            <span th:if="${t.rpe != null}">
                                · RPE <span th:text="${t.rpe}">7</span>
                            </span>
                        </p>
                    </div>
                </div>
            </a>
        </div>
    </div>

</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<div th:replace="~{fragments/layout :: scripts}"></div>

</body>
</html>
