<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="cs">
<head th:replace="~{fragments/layout :: head('Textové šablony')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar('admin-templates')}"></nav>
<main class="rk-page">

    <div class="rk-crumb">
        <span>Admin</span><span class="sep">/</span><span class="current">Textové šablony</span>
    </div>

    <div class="rk-page__head">
        <div><h1 class="rk-page__title">Textové šablony plánu</h1>
            <p class="rk-page__sub">Prostý text (dlouhodobý plán). Přiřazením vznikne uživateli editovatelná kopie.</p></div>
        <a th:href="@{/admin/text-plans/new}" class="btn btn-accent">+ Nová textová šablona</a>
    </div>

    <div th:if="${flashSuccess}" class="alert alert-success" th:text="${flashSuccess}"></div>
    <div th:if="${flashError}" class="alert alert-danger" th:text="${flashError}"></div>

    <div class="rk-card" th:if="${templates.isEmpty()}">
        <div class="rk-card__body"><p class="text-muted" style="margin:0;">Zatím žádná textová šablona.</p></div>
    </div>

    <div class="rk-card" th:each="tpl : ${templates}" style="margin-bottom: var(--sp-3);">
        <div class="rk-card__body" style="display:flex; justify-content:space-between; align-items:center; gap:12px;">
            <div>
                <strong th:text="${tpl.title}">Název</strong>
                <span class="text-muted" style="display:block; font-size: var(--fs-sm);"
                      th:text="${#temporals.format(tpl.createdAt, 'd. M. yyyy')}">datum</span>
            </div>
            <div style="display:flex; gap:6px;">
                <a th:href="@{/admin/text-plans/{id}/assign(id=${tpl.id})}" class="btn btn-accent btn-sm">📤 Přiřadit</a>
                <a th:href="@{/admin/text-plans/{id}/edit(id=${tpl.id})}" class="btn btn-outline btn-sm">Upravit</a>
                <form th:action="@{/admin/text-plans/{id}/delete(id=${tpl.id})}" method="post" class="d-inline"
                      onsubmit="return confirm('Smazat šablonu?');">
                    <button type="submit" class="btn btn-danger-outline btn-sm">Smazat</button>
                </form>
            </div>
        </div>
    </div>

</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
