<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="cs">
<head th:replace="~{fragments/layout :: head(${editingId != null} ? 'Upravit skupinový trénink' : 'Nový skupinový trénink')}"></head>
<body>

<nav th:replace="~{fragments/layout :: navbar('admin-group')}"></nav>

<main class="rk-page">

    <div class="rk-crumb">
        <span>Admin</span>
        <span class="sep">/</span>
        <a th:href="@{/admin/group-trainings}">Skupinové tréninky</a>
        <span class="sep">/</span>
        <span class="current" th:text="${editingId != null} ? 'Úprava' : 'Nový'">Nový</span>
    </div>

    <div class="rk-page__head">
        <div>
            <h1 class="rk-page__title" th:text="${editingId != null} ? 'Upravit skupinový trénink' : 'Nový skupinový trénink'">Nový skupinový trénink</h1>
        </div>
    </div>

    <p class="text-muted mb-4">
        Tento trénink uvidí <strong>všichni klienti</strong> ve svém deníku a na dashboardu pro daný den.
    </p>

    <form th:action="${editingId != null} ? @{/admin/group-trainings/{id}(id=${editingId})} : @{/admin/group-trainings}"
          th:object="${form}" method="post" id="trainingForm">

        <div th:if="${#fields.hasGlobalErrors()}" class="alert alert-danger">
            <ul class="mb-0">
                <li th:each="err : ${#fields.globalErrors()}" th:text="${err}">Error</li>
            </ul>
        </div>

        <!-- ==================== Hlavičky tréninku ==================== -->
        <div class="card mb-4">
            <div class="card-body">
                <h3 class="card-title mb-3">Trénink</h3>

                <div class="row g-3">
                    <div class="col-md-3">
                        <label for="trainingDate" class="form-label">Datum *</label>
                        <input type="date" id="trainingDate" th:field="*{trainingDate}" class="form-control"
                               th:classappend="${#fields.hasErrors('trainingDate')} ? 'is-invalid'">
                        <div class="invalid-feedback" th:errors="*{trainingDate}"></div>
                    </div>
                    <div class="col-md-3">
                        <label for="startTime" class="form-label">Začátek</label>
                        <input type="time" id="startTime" th:field="*{startTime}" class="form-control">
                    </div>
                    <div class="col-md-3">
                        <label for="endTime" class="form-label">Konec</label>
                        <input type="time" id="endTime" th:field="*{endTime}" class="form-control">
                    </div>
                    <div class="col-md-3">
                        <label for="difficulty" class="form-label">Obtížnost</label>
                        <select id="difficulty" name="difficulty" class="form-select">
                            <option value="">—</option>
                            <option th:each="g : ${difficultyGroups}" th:value="${g.representative}"
                                    th:selected="${form.difficulty != null and form.difficulty.level == g.representative.level}"
                                    th:text="${g.label}">Lehký trénink, Deload, Rychlost</option>
                        </select>
                    </div>

                    <div class="col-md-8">
                        <label for="name" class="form-label">Název tréninku</label>
                        <input type="text" id="name" th:field="*{name}" class="form-control"
                               placeholder="např. Pondělní KB lekce, Tabata HIIT...">
                    </div>
                    <div class="col-md-4">
                        <label for="rpe" class="form-label">RPE (1-10)</label>
                        <input type="number" id="rpe" th:field="*{rpe}" class="form-control" min="1" max="10">
                    </div>

                    <div class="col-12">
                        <label for="notes" class="form-label">Poznámky</label>
                        <textarea id="notes" th:field="*{notes}" class="form-control" rows="2"
                                  placeholder="kontext lekce, cíl, doporučení..."></textarea>
                    </div>

                    <div class="col-12" th:if="${!tags.isEmpty()}">
                        <label class="form-label">Tagy (jen systémové pro group)</label>
                        <div>
                            <div th:each="category : ${tagCategories}" class="tag-category-row" style="display:flex; align-items:flex-start; gap:8px; flex-wrap:wrap; margin-bottom:6px;">
                                <strong style="min-width:170px; padding-top:3px;" th:text="${category.label + ':'}">Obecné:</strong>
                                <div style="display:flex; flex-wrap:wrap; gap:8px;">
                                    <div th:each="tag : ${tags}" th:if="${tag.category == category}" class="form-check form-check-inline m-0">
                                        <input class="form-check-input" type="checkbox"
                                               th:id="'tag-' + ${tag.id}"
                                               th:value="${tag.id}"
                                               name="tagIds"
                                               th:checked="${form.tagIds.contains(tag.id)}">
                                        <label class="form-check-label" th:for="'tag-' + ${tag.id}">
                                            <span class="badge"
                                                  th:style="'background-color: ' + (${tag.color} ?: '#6c757d')"
                                                  th:text="${tag.name}">Tag</span>
                                        </label>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- ==================== Cviky ==================== -->
        <div th:replace="~{fragments/exercise-editor :: editor}"></div>

        <hr>

        <div class="d-flex gap-2 flex-wrap">
            <button type="submit" name="action" value="publish" class="btn btn-accent btn-lg">
                <span th:text="${editingId != null} ? 'Uložit změny' : 'Vytvořit skupinový trénink'">Vytvořit</span>
            </button>
            <!-- ScoutMeto kolo 7: draft — klienti trénink neuvidí, dokud ho admin nepublikuje -->
            <button type="submit" name="action" value="draft" class="btn btn-outline btn-lg"
                    title="Trénink se uloží, ale klientům se nezobrazí — publikuješ ho později ze seznamu.">
                Uložit, zatím nezveřejňovat
            </button>
            <a th:href="@{/admin/group-trainings}" class="btn btn-ghost btn-lg">Zrušit</a>
        </div>
    </form>

</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<div th:replace="~{fragments/layout :: scripts}"></div>
<div th:replace="~{fragments/exercise-editor :: scripts}"></div>

</body>
</html>
