<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="cs">
<head th:replace="~{fragments/layout :: head('Přiřadit skupinový trénink')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar('admin-group')}"></nav>
<main class="rk-page">

    <div class="rk-crumb">
        <span>Admin</span><span class="sep">/</span>
        <a th:href="@{/admin/group-trainings}">Skupinové tréninky</a><span class="sep">/</span>
        <span class="current">Přiřadit</span>
    </div>

    <div class="rk-page__head"><div>
        <h1 class="rk-page__title">Přiřadit skupinový trénink</h1>
        <p class="rk-page__sub">
            Trénink „<strong th:text="${training.name} ?: 'Trénink'">název</strong>" se zkopíruje
            klientovi do deníku jako soukromý záznam (s předepsanými cviky) — nezmizí mu s novým týdnem.
        </p>
    </div></div>

    <form th:action="@{/admin/group-trainings/{id}/assign(id=${training.id})}" method="post">
        <div class="rk-card"><div class="rk-card__body rk-stack-4">
            <div class="rk-field">
                <label class="rk-label" for="clientId">Uživatel</label>
                <select id="clientId" name="clientId" class="form-select" required>
                    <option value="">— vyber uživatele —</option>
                    <option th:each="c : ${clients}" th:value="${c.id}"
                            th:text="${c.lastName + ' ' + c.firstName + ' (' + c.email + ')'}">Klient</option>
                </select>
            </div>
            <div class="rk-field" style="max-width: 240px;">
                <label class="rk-label" for="trainingDate">Datum tréninku</label>
                <input type="date" id="trainingDate" name="trainingDate" class="form-control" required
                       th:value="${#temporals.format(defaultDate, 'yyyy-MM-dd')}">
            </div>
        </div></div>
        <div style="display:flex; gap:8px; margin-top: var(--sp-4);">
            <button type="submit" class="btn btn-accent btn-lg">Přiřadit</button>
            <a th:href="@{/admin/group-trainings}" class="btn btn-outline btn-lg">Zrušit</a>
        </div>
    </form>

</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
