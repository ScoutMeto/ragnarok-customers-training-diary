<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="cs">
<head th:replace="~{fragments/layout :: head('Plány klienta')}"></head>
<body class="d-flex flex-column min-vh-100">

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container py-4 flex-grow-1">

    <nav aria-label="breadcrumb" class="mb-3">
        <ol class="breadcrumb mb-0">
            <li class="breadcrumb-item">Admin</li>
            <li class="breadcrumb-item"><a th:href="@{/admin/accounts}">Účty</a></li>
            <li class="breadcrumb-item"><a th:href="@{/admin/accounts/{id}(id=${client.id})}"
                                            th:text="${client.firstName} + ' ' + ${client.lastName}">Klient</a></li>
            <li class="breadcrumb-item active">Plány od trenéra</li>
        </ol>
    </nav>

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="mb-0">📋 Plány od trenéra</h1>
        <a th:href="@{/admin/accounts/{id}/coach-plans/new(id=${client.id})}" class="btn btn-primary">+ Nový plán</a>
    </div>

    <div th:if="${flashSuccess}" class="alert alert-success" th:text="${flashSuccess}"></div>

    <p class="text-muted" th:if="${plans.isEmpty()}">Žádné plány zatím nejsou vytvořené.</p>

    <table class="table align-middle" th:unless="${plans.isEmpty()}">
        <thead>
        <tr>
            <th>Název</th>
            <th>Platnost</th>
            <th>Autor</th>
            <th>Vytvořeno</th>
            <th></th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="p : ${plans}">
            <td><a th:href="@{/admin/accounts/{cid}/coach-plans/{pid}(cid=${client.id}, pid=${p.id})}"
                   th:text="${p.title}">Název</a></td>
            <td>
                <span th:text="${#temporals.format(p.validFrom, 'dd.MM.yyyy')}">od</span>
                –
                <span th:text="${p.validTo != null ? #temporals.format(p.validTo, 'dd.MM.yyyy') : '∞'}">do</span>
            </td>
            <td th:text="${p.author.firstName} + ' ' + ${p.author.lastName}">Autor</td>
            <td th:text="${#temporals.format(p.createdAt, 'dd.MM.yyyy')}">23.05.</td>
            <td class="text-end">
                <a th:href="@{/admin/accounts/{cid}/coach-plans/{pid}/edit(cid=${client.id}, pid=${p.id})}"
                   class="btn btn-sm btn-outline-primary">Upravit</a>
                <form th:action="@{/admin/accounts/{cid}/coach-plans/{pid}/delete(cid=${client.id}, pid=${p.id})}"
                      method="post" class="d-inline"
                      onsubmit="return confirm('Smazat tento plán?');">
                    <button type="submit" class="btn btn-sm btn-outline-danger">Smazat</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>

</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<div th:replace="~{fragments/layout :: scripts}"></div>

</body>
</html>
