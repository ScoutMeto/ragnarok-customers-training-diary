<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="cs">
<head th:replace="~{fragments/layout :: head('Plány klienta')}"></head>
<body>

<nav th:replace="~{fragments/layout :: navbar('admin-accounts')}"></nav>

<main class="rk-page">

    <div class="rk-crumb">
        <span>Admin</span>
        <span class="sep">/</span>
        <a th:href="@{/admin/accounts}">Účty</a>
        <span class="sep">/</span>
        <a th:href="@{/admin/accounts/{id}(id=${client.id})}"
           th:text="${client.firstName + ' ' + client.lastName}">Klient</a>
        <span class="sep">/</span>
        <span class="current">Plány od trenéra</span>
    </div>

    <div class="rk-page__head">
        <div>
            <h1 class="rk-page__title">📋 Plány od trenéra</h1>
            <p class="rk-page__sub">
                Pro klienta <strong th:text="${client.firstName + ' ' + client.lastName}">Klient</strong>
            </p>
        </div>
        <div class="rk-page__actions">
            <a th:href="@{/admin/accounts/{id}/coach-plans/new(id=${client.id})}" class="btn btn-accent btn-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="16" height="16"><path d="M12 5v14M5 12h14"/></svg>
                Nový plán
            </a>
        </div>
    </div>

    <div th:if="${flashSuccess}" class="alert alert-success" th:text="${flashSuccess}"></div>

    <div th:if="${plans.isEmpty()}" class="rk-empty rk-card">
        <h3>Žádné plány zatím nejsou vytvořené</h3>
        <p>Napiš pro tohoto klienta první markdown plán.</p>
    </div>

    <table class="rk-table" th:unless="${plans.isEmpty()}">
        <thead>
        <tr>
            <th>Název</th>
            <th>Platnost</th>
            <th>Autor</th>
            <th>Vytvořeno</th>
            <th></th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="p : ${plans}">
            <td>
                <a th:href="@{/admin/accounts/{cid}/coach-plans/{pid}(cid=${client.id}, pid=${p.id})}"
                   style="color: var(--rk-ink); font-weight: 600;" th:text="${p.title}">Název</a>
            </td>
            <td class="num text-muted">
                <span th:text="${#temporals.format(p.validFrom, 'dd.MM.yyyy')}">od</span>
                –
                <span th:text="${p.validTo != null ? #temporals.format(p.validTo, 'dd.MM.yyyy') : '∞'}">do</span>
            </td>
            <td class="text-muted" th:text="${p.author.firstName + ' ' + p.author.lastName}">Autor</td>
            <td class="num text-muted" th:text="${#temporals.format(p.createdAt, 'dd.MM.yyyy')}">23.05.</td>
            <td class="text-end">
                <a th:href="@{/admin/accounts/{cid}/coach-plans/{pid}(cid=${client.id}, pid=${p.id})}"
                   class="btn btn-ghost btn-sm">Detail</a>
                <a th:href="@{/admin/accounts/{cid}/coach-plans/{pid}/edit(cid=${client.id}, pid=${p.id})}"
                   class="btn btn-outline btn-sm">Upravit</a>
                <form th:action="@{/admin/accounts/{cid}/coach-plans/{pid}/delete(cid=${client.id}, pid=${p.id})}"
                      method="post" class="d-inline"
                      onsubmit="return confirm('Smazat tento plán?');">
                    <button type="submit" class="btn btn-danger-outline btn-sm">Smazat</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>

</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<div th:replace="~{fragments/layout :: scripts}"></div>

</body>
</html>
