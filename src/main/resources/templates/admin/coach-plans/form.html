<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="cs">
<head th:replace="~{fragments/layout :: head('Plán klienta')}"></head>
<body class="d-flex flex-column min-vh-100">

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container py-4 flex-grow-1">

    <nav aria-label="breadcrumb" class="mb-3">
        <ol class="breadcrumb mb-0">
            <li class="breadcrumb-item">Admin</li>
            <li class="breadcrumb-item"><a th:href="@{/admin/accounts}">Účty</a></li>
            <li class="breadcrumb-item"><a th:href="@{/admin/accounts/{id}/coach-plans(id=${client.id})}"
                                            th:text="${client.firstName} + ' ' + ${client.lastName}">Klient</a></li>
            <li class="breadcrumb-item active" th:text="${plan != null ? 'Úprava' : 'Nový'}">Nový</li>
        </ol>
    </nav>

    <h1 class="mb-4" th:text="${plan != null ? 'Upravit plán' : 'Nový plán'}">Nový plán</h1>

    <form th:action="${plan != null
                        ? @{/admin/accounts/{cid}/coach-plans/{pid}(cid=${client.id}, pid=${plan.id})}
                        : @{/admin/accounts/{cid}/coach-plans(cid=${client.id})}}"
          method="post">

        <div class="card mb-4">
            <div class="card-body">
                <div class="row g-3">
                    <div class="col-md-12">
                        <label for="title" class="form-label">Název plánu *</label>
                        <input type="text" id="title" name="title" class="form-control"
                               th:value="${plan?.title}" required maxlength="128"
                               placeholder="např. 'Příprava na maraton — týden 1-4'">
                    </div>
                    <div class="col-md-4">
                        <label for="validFrom" class="form-label">Platnost od *</label>
                        <input type="date" id="validFrom" name="validFrom" class="form-control"
                               th:value="${plan?.validFrom ?: today}" required>
                    </div>
                    <div class="col-md-4">
                        <label for="validTo" class="form-label">Platnost do (nepovinné)</label>
                        <input type="date" id="validTo" name="validTo" class="form-control"
                               th:value="${plan?.validTo}">
                        <div class="form-text">Prázdné = otevřená platnost</div>
                    </div>
                    <div class="col-12">
                        <label for="bodyMarkdown" class="form-label">Obsah plánu (markdown)</label>
                        <textarea id="bodyMarkdown" name="bodyMarkdown" class="form-control"
                                  rows="15" required style="font-family: monospace;"
                                  th:text="${plan?.bodyMarkdown}"
                                  placeholder="# Týden 1&#10;&#10;## Pondělí&#10;- KB swing 5×10 s 24 kg&#10;- Goblet squat 3×8&#10;&#10;## Středa&#10;..."></textarea>
                        <div class="form-text">
                            Podporuje markdown: <code>**tučně**</code>, <code># nadpis</code>,
                            <code>## podnadpis</code>, seznam s <code>-</code>, atd.
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary"
                    th:text="${plan != null ? 'Uložit změny' : 'Vytvořit plán'}">Vytvořit</button>
            <a th:href="@{/admin/accounts/{id}/coach-plans(id=${client.id})}"
               class="btn btn-outline-secondary">Zrušit</a>
        </div>
    </form>

</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<div th:replace="~{fragments/layout :: scripts}"></div>

</body>
</html>
