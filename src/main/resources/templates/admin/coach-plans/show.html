<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="cs">
<head th:replace="~{fragments/layout :: head('Plán klienta')}"></head>
<body class="d-flex flex-column min-vh-100">

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container py-4 flex-grow-1">

    <nav aria-label="breadcrumb" class="mb-3">
        <ol class="breadcrumb mb-0">
            <li class="breadcrumb-item">Admin</li>
            <li class="breadcrumb-item"><a th:href="@{/admin/accounts/{id}/coach-plans(id=${client.id})}"
                                            th:text="${client.firstName} + ' ' + ${client.lastName}">Klient</a></li>
            <li class="breadcrumb-item active" th:text="${plan.title}">Plán</li>
        </ol>
    </nav>

    <div class="card mb-4">
        <div class="card-body">
            <div class="d-flex justify-content-between align-items-start mb-3">
                <div>
                    <h1 class="mb-1" th:text="${plan.title}">Plán</h1>
                    <p class="text-muted mb-0">
                        <strong>Platnost:</strong>
                        <span th:text="${#temporals.format(plan.validFrom, 'dd.MM.yyyy')}">od</span>
                        –
                        <span th:text="${plan.validTo != null ? #temporals.format(plan.validTo, 'dd.MM.yyyy') : '∞'}">do</span>
                        · Autor: <strong th:text="${plan.author.firstName} + ' ' + ${plan.author.lastName}">Trenér</strong>
                    </p>
                </div>
                <div class="d-flex gap-2">
                    <a th:href="@{/admin/accounts/{cid}/coach-plans/{pid}/edit(cid=${client.id}, pid=${plan.id})}"
                       class="btn btn-outline-primary btn-sm">Upravit</a>
                </div>
            </div>
            <hr>
            <div class="markdown-body" th:utext="${bodyHtml}">
                <!-- Vyrenderovaný markdown -->
            </div>
        </div>
    </div>

</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<div th:replace="~{fragments/layout :: scripts}"></div>

</body>
</html>
