<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="cs">
<head th:replace="~{fragments/layout :: head('Plán klienta')}"></head>
<body>

<nav th:replace="~{fragments/layout :: navbar('admin-accounts')}"></nav>

<main class="rk-page">

    <div class="rk-crumb">
        <span>Admin</span>
        <span class="sep">/</span>
        <a th:href="@{/admin/accounts/{id}/coach-plans(id=${client.id})}"
           th:text="${client.firstName + ' ' + client.lastName}">Klient</a>
        <span class="sep">/</span>
        <span class="current" th:text="${plan.title}">Plán</span>
    </div>

    <div class="rk-card" style="margin-bottom: var(--sp-5);">
        <div class="rk-card__body">
            <div class="rk-row" style="justify-content: space-between; align-items: flex-start;">
                <div style="flex: 1;">
                    <h1 style="font-size: var(--fs-h1); margin-bottom: 6px;" th:text="${plan.title}">Plán</h1>
                    <p class="text-muted" style="margin: 0; font-size: var(--fs-sm);">
                        <strong>Platnost:</strong>
                        <span class="num" th:text="${#temporals.format(plan.validFrom, 'dd.MM.yyyy')}">od</span>
                        –
                        <span class="num" th:text="${plan.validTo != null ? #temporals.format(plan.validTo, 'dd.MM.yyyy') : '∞'}">do</span>
                        · Autor <strong th:text="${plan.author.firstName + ' ' + plan.author.lastName}">Trenér</strong>
                    </p>
                </div>
                <div class="d-flex gap-2">
                    <a th:href="@{/admin/accounts/{cid}/coach-plans/{pid}/edit(cid=${client.id}, pid=${plan.id})}"
                       class="btn btn-outline btn-sm">Upravit</a>
                </div>
            </div>
            <hr style="margin: var(--sp-4) 0;">
            <div class="markdown-body" th:utext="${bodyHtml}">
                <!-- Vyrenderovaný markdown -->
            </div>
        </div>
    </div>

</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<div th:replace="~{fragments/layout :: scripts}"></div>

</body>
</html>
