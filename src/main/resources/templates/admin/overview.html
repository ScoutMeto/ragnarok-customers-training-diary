<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="cs">
<head th:replace="~{fragments/layout :: head('Admin: gym overview')}"></head>
<body>

<nav th:replace="~{fragments/layout :: navbar('admin-overview')}"></nav>

<main class="rk-page">

    <div class="rk-crumb">
        <span>Admin</span>
        <span class="sep">/</span>
        <span class="current">Gym overview</span>
    </div>

    <div class="rk-page__head">
        <div>
            <h1 class="rk-page__title">Gym overview</h1>
            <p class="rk-page__sub">Souhrn aktivit napříč všemi klienty.</p>
        </div>
    </div>

    <!-- Period -->
    <div class="rk-period" style="margin-bottom: var(--sp-5);">
        <div class="rk-field" style="min-width: 180px;">
            <label class="rk-label" for="periodSelect">Období</label>
            <select id="periodSelect" class="form-select">
                <option value="7">7 dní</option>
                <option value="30" selected>30 dní</option>
                <option value="90">90 dní</option>
                <option value="365">Rok</option>
            </select>
        </div>
        <div>
            <button id="refreshBtn" class="btn btn-accent btn-icon">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>
                Načíst
            </button>
        </div>
    </div>

    <!-- KPI tiles -->
    <div class="rk-stats-row" style="margin-bottom: var(--sp-5);">
        <div class="rk-kpi rk-kpi--accent">
            <div class="rk-kpi__label">Aktivní klienti</div>
            <div class="rk-kpi__value" id="kpiClients">—</div>
        </div>
        <div class="rk-kpi">
            <div class="rk-kpi__label">Osobní tréninky</div>
            <div class="rk-kpi__value" id="kpiPrivate">—</div>
        </div>
        <div class="rk-kpi">
            <div class="rk-kpi__label">Skupinové tréninky</div>
            <div class="rk-kpi__value" id="kpiGroup">—</div>
        </div>
        <div class="rk-kpi">
            <div class="rk-kpi__label">Total volume</div>
            <div class="rk-kpi__value">
                <span id="kpiVolume">—</span>
                <span class="rk-kpi__unit">kg</span>
            </div>
        </div>
    </div>

    <!-- Top active clients -->
    <div class="rk-card">
        <div class="rk-card__head">
            <div class="rk-card__title">Top aktivní klienti</div>
        </div>
        <div class="rk-card__body" style="padding: 0;">
            <table class="rk-table" style="border-radius: 0; border: 0; box-shadow: none;">
                <thead>
                <tr>
                    <th style="width: 50px;">#</th>
                    <th>Jméno</th>
                    <th>Email</th>
                    <th class="text-end">Počet tréninků</th>
                </tr>
                </thead>
                <tbody id="topClientsTbody">
                <tr><td colspan="4" class="text-muted">Načítám…</td></tr>
                </tbody>
            </table>
        </div>
    </div>

</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<div th:replace="~{fragments/layout :: scripts}"></div>

<script>
(function() {
    function isoDaysAgo(n) {
        const d = new Date();
        d.setDate(d.getDate() - n);
        return d.toISOString().slice(0, 10);
    }
    function isoToday() { return new Date().toISOString().slice(0, 10); }

    function load() {
        const days = parseInt(document.getElementById('periodSelect').value, 10);
        const from = isoDaysAgo(days);
        const to = isoToday();
        fetch(`/api/analysis/admin/overview?from=${from}&to=${to}`, { credentials: 'same-origin' })
            .then(r => r.ok ? r.json() : Promise.reject(r.statusText))
            .then(data => {
                document.getElementById('kpiClients').textContent = data.activeClients;
                document.getElementById('kpiPrivate').textContent = data.totalPrivateTrainings;
                document.getElementById('kpiGroup').textContent = data.totalGroupTrainings;
                document.getElementById('kpiVolume').textContent = data.gymTotalVolumeKg
                    ? parseFloat(data.gymTotalVolumeKg).toLocaleString('cs-CZ', { maximumFractionDigits: 0 })
                    : '0';
                const tbody = document.getElementById('topClientsTbody');
                tbody.innerHTML = '';
                if (!data.topActiveClients || data.topActiveClients.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="4" class="text-muted">Žádní aktivní klienti v tomto období.</td></tr>';
                    return;
                }
                data.topActiveClients.forEach((c, i) => {
                    const tr = document.createElement('tr');
                    const initials = (c.firstName||'?').charAt(0).toUpperCase() + (c.lastName||'').charAt(0).toUpperCase();
                    tr.innerHTML = `
                        <td class="num">${i + 1}</td>
                        <td>
                            <div style="display:flex; align-items:center; gap: 10px;">
                                <div class="rk-avatar" style="width:28px;height:28px;background:var(--rk-ink);">${initials}</div>
                                <strong>${c.firstName} ${c.lastName}</strong>
                            </div>
                        </td>
                        <td class="text-muted">${c.email}</td>
                        <td class="text-end num">${c.trainingCount}</td>`;
                    tbody.appendChild(tr);
                });
            })
            .catch(err => {
                console.error('Admin overview load error', err);
                alert('Chyba při načítání: ' + err);
            });
    }
    document.getElementById('refreshBtn').addEventListener('click', load);
    load();
})();
</script>

</body>
</html>
