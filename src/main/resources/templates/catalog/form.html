<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="cs">
<head th:replace="~{fragments/layout :: head('Cvik — formulář')}"></head>
<body>

<nav th:replace="~{fragments/layout :: navbar('catalog')}"></nav>

<main class="rk-page">

    <div class="rk-crumb">
        <a th:href="@{/catalog}">Katalog cviků</a>
        <span class="sep">/</span>
        <span class="current" th:text="${editingId != null} ? 'Úprava' : 'Nový cvik'">Nový cvik</span>
    </div>

    <div class="rk-page__head">
        <div>
            <h1 class="rk-page__title" th:text="${editingId != null} ? 'Upravit cvik' : 'Nový cvik'">Nový cvik</h1>
        </div>
    </div>

    <div th:if="${flashError}" class="alert alert-danger" th:text="${flashError}"></div>

    <form th:action="${editingId != null} ? @{/catalog/{id}(id=${editingId})} : @{/catalog}"
          th:object="${item}" method="post">

        <div class="rk-card" style="margin-bottom: var(--sp-5);">
            <div class="rk-card__body">
                <div class="row g-3">
                    <div class="col-12">
                        <div class="rk-field">
                            <label class="rk-label" for="name">Název cviku <span class="req">*</span></label>
                            <input type="text" id="name" th:field="*{name}" class="form-control" required maxlength="128"
                                   placeholder="např. Turkish Get-Up">
                        </div>
                    </div>
                    <!-- kolo 10: cvik může spadat do víc oblastí těla i mít víc pohybových vzorců -->
                    <div class="col-md-4">
                        <div class="rk-field">
                            <label class="rk-label">Oblast těla</label>
                            <div class="form-text mb-1">Lze zvolit i víc oblastí. Přidáním nové oblasti se vytvoří také odpovídající analytický tag.</div>
                            <div id="bodyRegionBoxes" class="d-flex flex-column gap-1">
                                <div th:each="b : ${bodyRegions}" class="form-check m-0">
                                    <input type="checkbox" class="form-check-input"
                                           th:id="'br-' + ${b.id}" th:field="*{bodyRegions}" th:value="${b.name}">
                                    <label class="form-check-label" th:for="'br-' + ${b.id}" th:text="${b.label}">Horní část těla</label>
                                </div>
                            </div>
                            <div class="catalog-attr-manage" data-kind="BODY_REGION"
                                 data-checkboxes="bodyRegionBoxes" data-field="bodyRegions" data-auto-tag="true">
                                <div style="display:flex; gap:6px; margin-top:6px;">
                                    <input type="text" class="form-control form-control-sm attr-new" placeholder="vlastní oblast těla" maxlength="64">
                                    <button type="button" class="btn btn-sm btn-outline-secondary attr-add">Přidat</button>
                                </div>
                                <div class="attr-custom-list" style="display:flex; flex-wrap:wrap; gap:6px; margin-top:6px;"></div>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="rk-field">
                            <label class="rk-label">Pohybový vzorec</label>
                            <div class="form-text mb-1">Složitější cvik jich může mít víc.</div>
                            <div id="movementPatternBoxes" class="d-flex flex-column gap-1">
                                <div th:each="mp : ${movementPatterns}" class="form-check m-0">
                                    <input type="checkbox" class="form-check-input"
                                           th:id="'mp-' + ${mp.id}" th:field="*{movementPatterns}" th:value="${mp.name}">
                                    <label class="form-check-label" th:for="'mp-' + ${mp.id}" th:text="${mp.label}">Tlak</label>
                                </div>
                            </div>
                            <div class="catalog-attr-manage" data-kind="MOVEMENT_PATTERN"
                                 data-checkboxes="movementPatternBoxes" data-field="movementPatterns" data-auto-tag="true">
                                <div style="display:flex; gap:6px; margin-top:6px;">
                                    <input type="text" class="form-control form-control-sm attr-new" placeholder="vlastní vzorec" maxlength="64">
                                    <button type="button" class="btn btn-sm btn-outline-secondary attr-add">Přidat</button>
                                </div>
                                <div class="attr-custom-list" style="display:flex; flex-wrap:wrap; gap:6px; margin-top:6px;"></div>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="rk-field">
                            <label class="rk-label" for="equipment">Náčiní</label>
                            <select id="equipment" th:field="*{equipment}" class="form-select">
                                <option value="">—</option>
                                <option th:each="op : ${equipments}" th:value="${op.name}" th:text="${op.label}">KETTLEBELL</option>
                            </select>
                            <div class="catalog-attr-manage" data-kind="EQUIPMENT" data-select="equipment" data-ask-tag="true">
                                <div style="display:flex; gap:6px; margin-top:6px;">
                                    <input type="text" class="form-control form-control-sm attr-new" placeholder="vlastní náčiní" maxlength="64">
                                    <button type="button" class="btn btn-sm btn-outline-secondary attr-add">Přidat</button>
                                </div>
                                <div class="attr-custom-list" style="display:flex; flex-wrap:wrap; gap:6px; margin-top:6px;"></div>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="rk-field">
                            <label class="rk-label" for="primaryMuscle">Primární sval</label>
                            <input type="text" id="primaryMuscle" th:field="*{primaryMuscle}" class="form-control"
                                   maxlength="64" placeholder="např. hamstringy">
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="rk-field">
                            <label class="rk-label" for="secondaryMuscles">Zapojené svaly</label>
                            <input type="text" id="secondaryMuscles" th:field="*{secondaryMuscles}" class="form-control"
                                   maxlength="255" placeholder="např. hýždě, střed těla, předloktí">
                        </div>
                    </div>
                    <div class="col-12">
                        <div class="rk-field">
                            <label class="rk-label" for="description">Popis & technika (coaching cues)</label>
                            <textarea id="description" th:field="*{description}" class="form-control" rows="6"
                                      placeholder="Jak se cvik provádí, na co si dát pozor, dýchání, časté chyby…"></textarea>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-accent btn-lg"
                    th:text="${editingId != null} ? 'Uložit změny' : 'Vytvořit cvik'">Vytvořit cvik</button>
            <a th:href="${editingId != null} ? @{/catalog/{id}(id=${editingId})} : @{/catalog}"
               class="btn btn-outline btn-lg">Zrušit</a>
        </div>
    </form>

</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<div th:replace="~{fragments/layout :: scripts}"></div>

<!-- Phase 20a/b+: správa rozšiřitelného číselníku přes /api/catalog-options -->
<script>
(function () {
    document.querySelectorAll('.catalog-attr-manage').forEach(function (box) {
        const kind = box.getAttribute('data-kind');
        const boxesId = box.getAttribute('data-checkboxes');
        const boxes = boxesId ? document.getElementById(boxesId) : null;
        const fieldName = box.getAttribute('data-field');
        const select = boxes ? null : document.getElementById(box.getAttribute('data-select'));
        const input = box.querySelector('.attr-new');
        const addBtn = box.querySelector('.attr-add');
        const list = box.querySelector('.attr-custom-list');
        const autoTag = box.getAttribute('data-auto-tag') === 'true';
        const askTag = box.getAttribute('data-ask-tag') === 'true';
        let pending = null;

        function checkedValues() {
            if (!boxes) return [];
            return [...boxes.querySelectorAll('input[type=checkbox]:checked')].map(c => c.value);
        }

        function customChip(o) {
            const chip = document.createElement('span');
            chip.style.cssText = 'display:inline-flex; align-items:center; gap:4px; border:1px solid var(--rk-border); border-radius:999px; padding:2px 8px; font-size:12px;';
            chip.appendChild(document.createTextNode(o.label || o.name));
            const x = document.createElement('button');
            x.type = 'button'; x.textContent = '−'; x.title = 'Smazat hodnotu';
            x.style.cssText = 'background:none; border:none; cursor:pointer; line-height:1; color:var(--rk-danger);';
            x.addEventListener('click', function () { del(o.id); });
            chip.appendChild(x);
            return chip;
        }

        function rebuildCheckboxes(options) {
            const current = new Set(pending || checkedValues());
            pending = null;
            boxes.innerHTML = '';
            list.innerHTML = '';
            options.forEach(function (o) {
                const wrap = document.createElement('div');
                wrap.className = 'form-check m-0';
                const chk = document.createElement('input');
                chk.type = 'checkbox'; chk.className = 'form-check-input';
                chk.name = fieldName; chk.value = o.name; chk.id = kind.toLowerCase() + '-' + o.id;
                chk.checked = current.has(o.name);
                const lab = document.createElement('label');
                lab.className = 'form-check-label'; lab.htmlFor = chk.id; lab.textContent = o.label || o.name;
                wrap.appendChild(chk); wrap.appendChild(lab);
                boxes.appendChild(wrap);
                if (!o.system) list.appendChild(customChip(o));
            });
        }

        function rebuildSelect(options) {
            const current = select.value;
            select.innerHTML = '<option value="">—</option>';
            list.innerHTML = '';
            options.forEach(function (o) {
                const opt = document.createElement('option');
                opt.value = o.name; opt.textContent = o.label || o.name;
                select.appendChild(opt);
                if (!o.system) list.appendChild(customChip(o));
            });
            if (current && !Array.prototype.some.call(select.options, o => o.value === current)) {
                const opt = document.createElement('option');
                opt.value = current; opt.textContent = current; select.appendChild(opt);
            }
            select.value = current;
        }

        function rebuild(options) {
            if (boxes) rebuildCheckboxes(options); else rebuildSelect(options);
        }

        function load() {
            fetch('/api/catalog-options?kind=' + kind)
                .then(r => r.json()).then(rebuild).catch(()=>{});
        }
        function add() {
            const name = (input.value || '').trim();
            if (!name) return;
            const createTag = autoTag || (askTag && window.confirm('Vytvořit k této hodnotě také tag pro zápis tréninku a statistiky?'));
            fetch('/api/catalog-options', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ kind: kind, name: name, createTag: createTag })
            }).then(r => r.ok ? r.json() : null).then(o => {
                if (!o) return;
                input.value = '';
                const value = o.name || name;
                if (o.duplicate) window.alert('Tato hodnota už existuje. Použije se existující položka.');
                if (o.tagDuplicate) window.alert('Tag se stejným názvem už existuje. Nový tag se proto nevytvořil.');
                if (boxes) { pending = checkedValues().concat([value]); load(); }
                else { select.value = value; load(); setTimeout(() => { select.value = value; }, 100); }
            });
        }
        function del(id) {
            fetch('/api/catalog-options/' + id, { method: 'DELETE' }).then(r => { if (r.ok) load(); });
        }
        addBtn.addEventListener('click', add);
        input.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); add(); } });
        load();
    });
})();
</script>

</body>
</html>
