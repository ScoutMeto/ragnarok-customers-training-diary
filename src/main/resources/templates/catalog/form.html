<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="cs">
<head th:replace="~{fragments/layout :: head('Cvik — formulář')}"></head>
<body>

<nav th:replace="~{fragments/layout :: navbar('catalog')}"></nav>

<main class="rk-page">

    <div class="rk-crumb">
        <a th:href="@{/catalog}">Katalog cviků</a>
        <span class="sep">/</span>
        <span class="current" th:text="${editingId != null} ? 'Úprava' : 'Nový cvik'">Nový cvik</span>
    </div>

    <div class="rk-page__head">
        <div>
            <h1 class="rk-page__title" th:text="${editingId != null} ? 'Upravit cvik' : 'Nový cvik'">Nový cvik</h1>
        </div>
    </div>

    <div th:if="${flashError}" class="alert alert-danger" th:text="${flashError}"></div>

    <form th:action="${editingId != null} ? @{/catalog/{id}(id=${editingId})} : @{/catalog}"
          th:object="${item}" method="post">

        <div class="rk-card" style="margin-bottom: var(--sp-5);">
            <div class="rk-card__body">
                <div class="row g-3">
                    <div class="col-12">
                        <div class="rk-field">
                            <label class="rk-label" for="name">Název cviku <span class="req">*</span></label>
                            <input type="text" id="name" th:field="*{name}" class="form-control" required maxlength="128"
                                   placeholder="např. Turkish Get-Up">
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="rk-field">
                            <label class="rk-label" for="bodyRegion">Oblast těla</label>
                            <select id="bodyRegion" th:field="*{bodyRegion}" class="form-select">
                                <option value="">—</option>
                                <option th:each="b : ${bodyRegions}" th:value="${b}" th:text="${b}">UPPER_BODY</option>
                            </select>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="rk-field">
                            <label class="rk-label" for="movementPattern">Pohybový vzorec</label>
                            <select id="movementPattern" th:field="*{movementPattern}" class="form-select">
                                <option value="">—</option>
                                <option th:each="mp : ${movementPatterns}" th:value="${mp.name}" th:text="${mp.name}">PUSH</option>
                            </select>
                            <div class="catalog-attr-manage" data-kind="MOVEMENT_PATTERN" data-select="movementPattern">
                                <div style="display:flex; gap:6px; margin-top:6px;">
                                    <input type="text" class="form-control form-control-sm attr-new" placeholder="vlastní vzorec" maxlength="64">
                                    <button type="button" class="btn btn-sm btn-outline-secondary attr-add">Přidat</button>
                                </div>
                                <div class="attr-custom-list" style="display:flex; flex-wrap:wrap; gap:6px; margin-top:6px;"></div>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="rk-field">
                            <label class="rk-label" for="equipment">Náčiní</label>
                            <select id="equipment" th:field="*{equipment}" class="form-select">
                                <option value="">—</option>
                                <option th:each="op : ${equipments}" th:value="${op.name}" th:text="${op.name}">KETTLEBELL</option>
                            </select>
                            <div class="catalog-attr-manage" data-kind="EQUIPMENT" data-select="equipment">
                                <div style="display:flex; gap:6px; margin-top:6px;">
                                    <input type="text" class="form-control form-control-sm attr-new" placeholder="vlastní náčiní" maxlength="64">
                                    <button type="button" class="btn btn-sm btn-outline-secondary attr-add">Přidat</button>
                                </div>
                                <div class="attr-custom-list" style="display:flex; flex-wrap:wrap; gap:6px; margin-top:6px;"></div>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="rk-field">
                            <label class="rk-label" for="primaryMuscle">Primární sval</label>
                            <input type="text" id="primaryMuscle" th:field="*{primaryMuscle}" class="form-control"
                                   maxlength="64" placeholder="např. hamstringy">
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="rk-field">
                            <label class="rk-label" for="secondaryMuscles">Zapojené svaly</label>
                            <input type="text" id="secondaryMuscles" th:field="*{secondaryMuscles}" class="form-control"
                                   maxlength="255" placeholder="např. hýždě, střed těla, předloktí">
                        </div>
                    </div>
                    <div class="col-12">
                        <div class="rk-field">
                            <label class="rk-label" for="description">Popis & technika (coaching cues)</label>
                            <textarea id="description" th:field="*{description}" class="form-control" rows="6"
                                      placeholder="Jak se cvik provádí, na co si dát pozor, dýchání, časté chyby…"></textarea>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-accent btn-lg"
                    th:text="${editingId != null} ? 'Uložit změny' : 'Vytvořit cvik'">Vytvořit cvik</button>
            <a th:href="${editingId != null} ? @{/catalog/{id}(id=${editingId})} : @{/catalog}"
               class="btn btn-outline btn-lg">Zrušit</a>
        </div>
    </form>

</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<div th:replace="~{fragments/layout :: scripts}"></div>

<!-- Phase 20a/b: správa rozšiřitelného číselníku (pohybový vzorec, náčiní) přes /api/catalog-options -->
<script>
(function () {
    document.querySelectorAll('.catalog-attr-manage').forEach(function (box) {
        const kind = box.getAttribute('data-kind');
        const select = document.getElementById(box.getAttribute('data-select'));
        const input = box.querySelector('.attr-new');
        const addBtn = box.querySelector('.attr-add');
        const list = box.querySelector('.attr-custom-list');

        function rebuild(options) {
            const current = select.value;
            // ponech prázdnou volbu, zbytek přegeneruj
            select.innerHTML = '<option value="">—</option>';
            list.innerHTML = '';
            options.forEach(function (o) {
                const opt = document.createElement('option');
                opt.value = o.name; opt.textContent = o.name;
                select.appendChild(opt);
                if (!o.system) {
                    const chip = document.createElement('span');
                    chip.style.cssText = 'display:inline-flex; align-items:center; gap:4px; border:1px solid var(--rk-border); border-radius:999px; padding:2px 8px; font-size:12px;';
                    chip.appendChild(document.createTextNode(o.name));
                    const x = document.createElement('button');
                    x.type = 'button'; x.textContent = '−'; x.title = 'Smazat hodnotu';
                    x.style.cssText = 'background:none; border:none; cursor:pointer; line-height:1; color:var(--rk-danger);';
                    x.addEventListener('click', function () { del(o.id); });
                    chip.appendChild(x);
                    list.appendChild(chip);
                }
            });
            // obnov vybranou hodnotu (i kdyby to byla vlastní)
            if (current && !Array.prototype.some.call(select.options, o => o.value === current)) {
                const opt = document.createElement('option');
                opt.value = current; opt.textContent = current; select.appendChild(opt);
            }
            select.value = current;
        }

        function load() {
            fetch('/api/catalog-options?kind=' + kind)
                .then(r => r.json()).then(rebuild).catch(()=>{});
        }
        function add() {
            const name = (input.value || '').trim();
            if (!name) return;
            fetch('/api/catalog-options', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ kind: kind, name: name })
            }).then(r => { if (r.ok) { input.value=''; select.value=name; load(); setTimeout(()=>{select.value=name;},100);} });
        }
        function del(id) {
            fetch('/api/catalog-options/' + id, { method: 'DELETE' }).then(r => { if (r.ok) load(); });
        }
        addBtn.addEventListener('click', add);
        input.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); add(); } });
        load();
    });
})();
</script>

</body>
</html>
