<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="cs">
<head th:replace="~{fragments/layout :: head(${editingId != null} ? 'Upravit trénink' : 'Nový trénink')}"></head>
<body class="d-flex flex-column min-vh-100">

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container py-4 flex-grow-1">

    <nav aria-label="breadcrumb" class="mb-3">
        <ol class="breadcrumb mb-0">
            <li class="breadcrumb-item"><a th:href="@{/diary}">Můj deník</a></li>
            <li class="breadcrumb-item active" aria-current="page"
                th:text="${editingId != null} ? 'Upravit trénink' : 'Nový trénink'">Nový trénink</li>
        </ol>
    </nav>

    <h1 class="mb-4" th:text="${editingId != null} ? 'Upravit trénink' : 'Nový trénink'">Nový trénink</h1>

    <div th:if="${#fields.hasGlobalErrors()}" class="alert alert-danger">
        <ul class="mb-0">
            <li th:each="err : ${#fields.globalErrors()}" th:text="${err}">Error</li>
        </ul>
    </div>

    <form th:action="${editingId != null} ? @{/diary/{id}(id=${editingId})} : @{/diary}"
          th:object="${form}" method="post" id="trainingForm">

        <!-- ==================== Hlavičky tréninku ==================== -->
        <div class="card mb-4">
            <div class="card-body">
                <h3 class="card-title mb-3">Trénink</h3>

                <div class="row g-3">
                    <div class="col-md-3">
                        <label for="trainingDate" class="form-label">Datum *</label>
                        <input type="date" id="trainingDate" th:field="*{trainingDate}" class="form-control"
                               th:classappend="${#fields.hasErrors('trainingDate')} ? 'is-invalid'">
                        <div class="invalid-feedback" th:errors="*{trainingDate}"></div>
                    </div>
                    <div class="col-md-3">
                        <label for="startTime" class="form-label">Začátek</label>
                        <input type="time" id="startTime" th:field="*{startTime}" class="form-control">
                    </div>
                    <div class="col-md-3">
                        <label for="endTime" class="form-label">Konec</label>
                        <input type="time" id="endTime" th:field="*{endTime}" class="form-control">
                    </div>
                    <div class="col-md-3">
                        <label for="difficulty" class="form-label">Obtížnost</label>
                        <select id="difficulty" th:field="*{difficulty}" class="form-select">
                            <option value="">—</option>
                            <option th:each="d : ${difficulties}" th:value="${d}" th:text="${d}">MEDIUM</option>
                        </select>
                    </div>

                    <div class="col-md-8">
                        <label for="name" class="form-label">Název tréninku</label>
                        <input type="text" id="name" th:field="*{name}" class="form-control"
                               placeholder="např. KB silový, Bodyweight ráno...">
                    </div>
                    <div class="col-md-4">
                        <label for="rpe" class="form-label">RPE (1-10)</label>
                        <input type="number" id="rpe" th:field="*{rpe}" class="form-control" min="1" max="10">
                    </div>

                    <div class="col-12">
                        <label for="notes" class="form-label">Poznámky</label>
                        <textarea id="notes" th:field="*{notes}" class="form-control" rows="2"
                                  placeholder="cokoliv k tréninku — pocit, kontext, ..."></textarea>
                    </div>

                    <div class="col-12" th:if="${!tags.isEmpty()}">
                        <label class="form-label">Tagy</label>
                        <div>
                            <div th:each="tag : ${tags}" class="form-check form-check-inline">
                                <input class="form-check-input" type="checkbox"
                                       th:id="'tag-' + ${tag.id}"
                                       th:value="${tag.id}"
                                       name="tagIds"
                                       th:checked="${form.tagIds.contains(tag.id)}">
                                <label class="form-check-label" th:for="'tag-' + ${tag.id}">
                                    <span class="badge"
                                          th:style="'background-color: ' + (${tag.color} ?: '#6c757d')"
                                          th:text="${tag.name}">Tag</span>
                                </label>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- ==================== Cviky ==================== -->
        <h3 class="mb-3">Cviky</h3>

        <div id="exercisesContainer">
            <div th:each="ex, exStat : ${form.exercises}"
                 class="card mb-3 exercise-card"
                 th:attr="data-exercise-index=${exStat.index}">
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-start mb-3">
                        <h5 class="mb-0">
                            <span class="text-muted me-2 exercise-number" th:text="${exStat.count} + '.'">1.</span>
                            Cvik
                        </h5>
                        <button type="button" class="btn btn-sm btn-outline-danger remove-exercise"
                                title="Odstranit cvik">×</button>
                    </div>

                    <!-- Hidden type field (Phase 1: always FREEFORM) -->
                    <input type="hidden" th:name="|exercises[${exStat.index}].type|" value="FREEFORM">

                    <div class="row g-3 mb-3">
                        <div class="col-md-7">
                            <label class="form-label">Cvik z katalogu</label>
                            <select th:name="|exercises[${exStat.index}].catalogItemId|"
                                    th:value="${ex.catalogItemId}"
                                    class="form-select catalog-select">
                                <option value="">— vyber z katalogu —</option>
                                <option th:each="ci : ${catalogItems}"
                                        th:value="${ci.id}"
                                        th:selected="${ex.catalogItemId == ci.id}"
                                        th:text="${ci.name} + ' (' + ${ci.equipment} + ')'">Cvik</option>
                            </select>
                            <div class="form-text">Nebo zadej vlastní název níže.</div>
                        </div>
                        <div class="col-md-5">
                            <label class="form-label">Vlastní název</label>
                            <input type="text" th:name="|exercises[${exStat.index}].customName|"
                                   th:value="${ex.customName}"
                                   class="form-control custom-name-input"
                                   placeholder="vlastní cvik...">
                        </div>

                        <div class="col-md-3">
                            <label class="form-label">RPE (1-10)</label>
                            <input type="number" th:name="|exercises[${exStat.index}].rpe|"
                                   th:value="${ex.rpe}"
                                   class="form-control" min="1" max="10">
                        </div>
                        <div class="col-md-9">
                            <label class="form-label">Poznámka ke cviku</label>
                            <input type="text" th:name="|exercises[${exStat.index}].notes|"
                                   th:value="${ex.notes}"
                                   class="form-control"
                                   placeholder="technika, pocit, tempo...">
                        </div>
                    </div>

                    <h6 class="mb-2">Série</h6>
                    <table class="table table-sm sets-table">
                        <thead>
                        <tr>
                            <th style="width: 50px;">#</th>
                            <th>Váha (kg)</th>
                            <th>Opakování</th>
                            <th>RPE</th>
                            <th>Poznámka</th>
                            <th style="width: 40px;"></th>
                        </tr>
                        </thead>
                        <tbody class="sets-tbody">
                        <tr th:each="s, sStat : ${ex.sets}" class="set-row">
                            <td class="set-number" th:text="${sStat.count}">1</td>
                            <td>
                                <input type="number" step="0.25"
                                       th:name="|exercises[${exStat.index}].sets[${sStat.index}].weightKg|"
                                       th:value="${s.weightKg}"
                                       class="form-control form-control-sm">
                            </td>
                            <td>
                                <input type="number"
                                       th:name="|exercises[${exStat.index}].sets[${sStat.index}].reps|"
                                       th:value="${s.reps}"
                                       class="form-control form-control-sm">
                            </td>
                            <td>
                                <input type="number" min="1" max="10"
                                       th:name="|exercises[${exStat.index}].sets[${sStat.index}].rpe|"
                                       th:value="${s.rpe}"
                                       class="form-control form-control-sm">
                            </td>
                            <td>
                                <input type="text"
                                       th:name="|exercises[${exStat.index}].sets[${sStat.index}].note|"
                                       th:value="${s.note}"
                                       class="form-control form-control-sm">
                            </td>
                            <td>
                                <button type="button" class="btn btn-sm btn-outline-danger remove-set"
                                        title="Odstranit set">×</button>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                    <button type="button" class="btn btn-sm btn-outline-secondary add-set">+ Přidat set</button>
                </div>
            </div>
        </div>

        <button type="button" class="btn btn-outline-primary mb-4" id="addExerciseBtn">
            + Přidat cvik
        </button>

        <hr>

        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">
                <span th:text="${editingId != null} ? 'Uložit změny' : 'Vytvořit trénink'">Uložit</span>
            </button>
            <a th:href="${editingId != null} ? @{/diary/{id}(id=${editingId})} : @{/diary}"
               class="btn btn-outline-secondary">Zrušit</a>
        </div>
    </form>

</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<div th:replace="~{fragments/layout :: scripts}"></div>

<!-- Template pro nový cvik (klonovaný JS) -->
<template id="exerciseTemplate">
    <div class="card mb-3 exercise-card">
        <div class="card-body">
            <div class="d-flex justify-content-between align-items-start mb-3">
                <h5 class="mb-0">
                    <span class="text-muted me-2 exercise-number">N.</span>
                    Cvik
                </h5>
                <button type="button" class="btn btn-sm btn-outline-danger remove-exercise">×</button>
            </div>

            <input type="hidden" data-name="type" value="FREEFORM">

            <div class="row g-3 mb-3">
                <div class="col-md-7">
                    <label class="form-label">Cvik z katalogu</label>
                    <select data-name="catalogItemId" class="form-select catalog-select">
                        <option value="">— vyber z katalogu —</option>
                    </select>
                    <div class="form-text">Nebo zadej vlastní název níže.</div>
                </div>
                <div class="col-md-5">
                    <label class="form-label">Vlastní název</label>
                    <input type="text" data-name="customName" class="form-control custom-name-input">
                </div>
                <div class="col-md-3">
                    <label class="form-label">RPE (1-10)</label>
                    <input type="number" data-name="rpe" min="1" max="10" class="form-control">
                </div>
                <div class="col-md-9">
                    <label class="form-label">Poznámka ke cviku</label>
                    <input type="text" data-name="notes" class="form-control">
                </div>
            </div>

            <h6 class="mb-2">Série</h6>
            <table class="table table-sm sets-table">
                <thead>
                <tr>
                    <th style="width: 50px;">#</th>
                    <th>Váha (kg)</th>
                    <th>Opakování</th>
                    <th>RPE</th>
                    <th>Poznámka</th>
                    <th style="width: 40px;"></th>
                </tr>
                </thead>
                <tbody class="sets-tbody"></tbody>
            </table>
            <button type="button" class="btn btn-sm btn-outline-secondary add-set">+ Přidat set</button>
        </div>
    </div>
</template>

<template id="setRowTemplate">
    <tr class="set-row">
        <td class="set-number">N</td>
        <td><input type="number" step="0.25" data-name="weightKg" class="form-control form-control-sm"></td>
        <td><input type="number" data-name="reps" class="form-control form-control-sm"></td>
        <td><input type="number" min="1" max="10" data-name="rpe" class="form-control form-control-sm"></td>
        <td><input type="text" data-name="note" class="form-control form-control-sm"></td>
        <td><button type="button" class="btn btn-sm btn-outline-danger remove-set">×</button></td>
    </tr>
</template>

<script th:src="@{/js/diary-form.js}"></script>
<script th:inline="javascript">
    /*<![CDATA[*/
    // Předáme JS data o katalogu pro klonovaný dropdown
    window.__catalogItems = /*[[${catalogItems}]]*/ [];
    window.__catalogItems = window.__catalogItems.map(ci => ({ id: ci.id, name: ci.name, equipment: ci.equipment }));
    /*]]>*/
</script>

</body>
</html>
