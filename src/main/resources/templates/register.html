<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="cs">
<head th:replace="~{fragments/layout :: head('Registrace')}"></head>
<body>

<div class="rk-app">
    <div class="rk-auth">
        <div class="rk-auth__card" style="max-width: 520px;">
            <div class="rk-auth__brand">
                <span style="display:inline-flex; align-items:center; gap:10px;">
                    <span class="rk-brand__mark" style="width:32px; height:32px; font-size:18px;">R</span>
                    Ragnarok
                </span>
                <span class="sub">Vytvoření klientského účtu</span>
            </div>

            <div class="rk-card">
                <div class="rk-card__body">
                    <h2 style="font-size:var(--fs-h2); margin-bottom: var(--sp-2);">Registrace</h2>
                    <p class="text-muted" style="margin-bottom: var(--sp-5); font-size: var(--fs-sm);">
                        Pojď do týmu Ragnaroku. Pole označená * jsou povinná.
                    </p>

                    <form th:action="@{/register}" th:object="${form}" method="post" class="rk-stack-4" novalidate>

                        <div th:if="${#fields.hasGlobalErrors()}" class="alert alert-danger">
                            <div th:each="err : ${#fields.globalErrors()}" th:text="${err}"></div>
                        </div>

                        <div class="row g-3">
                            <div class="col-sm-6">
                                <div class="rk-field">
                                    <label class="rk-label" for="firstName">Jméno <span class="req">*</span></label>
                                    <input class="form-control" id="firstName" type="text" th:field="*{firstName}"
                                           th:classappend="${#fields.hasErrors('firstName')} ? ' is-invalid'">
                                    <p class="rk-help" style="color: var(--rk-danger);"
                                       th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}"></p>
                                </div>
                            </div>
                            <div class="col-sm-6">
                                <div class="rk-field">
                                    <label class="rk-label" for="lastName">Příjmení <span class="req">*</span></label>
                                    <input class="form-control" id="lastName" type="text" th:field="*{lastName}"
                                           th:classappend="${#fields.hasErrors('lastName')} ? ' is-invalid'">
                                    <p class="rk-help" style="color: var(--rk-danger);"
                                       th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}"></p>
                                </div>
                            </div>
                        </div>

                        <div class="rk-field">
                            <label class="rk-label" for="nickname">Přezdívka <span class="req">*</span></label>
                            <input class="form-control" id="nickname" type="text" th:field="*{nickname}"
                                   th:classappend="${#fields.hasErrors('nickname')} ? ' is-invalid'">
                            <p class="rk-help">Zobrazuje se v navigaci.</p>
                            <p class="rk-help" style="color: var(--rk-danger);"
                               th:if="${#fields.hasErrors('nickname')}" th:errors="*{nickname}"></p>
                        </div>

                        <div class="rk-field">
                            <label class="rk-label" for="email">Email <span class="req">*</span></label>
                            <input class="form-control" id="email" type="email" th:field="*{email}"
                                   th:classappend="${#fields.hasErrors('email')} ? ' is-invalid'">
                            <p class="rk-help" style="color: var(--rk-danger);"
                               th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></p>
                        </div>

                        <div class="rk-field">
                            <label class="rk-label" for="phone">Telefon</label>
                            <input class="form-control" id="phone" type="tel" th:field="*{phone}"
                                   th:classappend="${#fields.hasErrors('phone')} ? ' is-invalid'">
                            <p class="rk-help">Nepovinné. Pomáhá při rezervacích.</p>
                            <p class="rk-help" style="color: var(--rk-danger);"
                               th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></p>
                        </div>

                        <div class="rk-field">
                            <label class="rk-label" for="password">Heslo <span class="req">*</span></label>
                            <input class="form-control" id="password" type="password" th:field="*{password}"
                                   th:classappend="${#fields.hasErrors('password')} ? ' is-invalid'">
                            <p class="rk-help">Aspoň 8 znaků.</p>
                            <p class="rk-help" style="color: var(--rk-danger);"
                               th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></p>
                        </div>

                        <button type="submit" class="btn btn-accent btn-lg btn-block">Vytvořit účet</button>
                    </form>

                    <hr>
                    <p class="text-center text-muted" style="font-size: var(--fs-sm); margin: 0;">
                        Už máš účet?
                        <a th:href="@{/login}" style="color: var(--rk-primary); font-weight: 600;">Přihlas se</a>
                    </p>
                </div>
            </div>

            <p class="text-center text-muted" style="font-size: var(--fs-xs); margin-top: var(--sp-4);">
                Ragnarok Training Diary ·
                <span th:text="${#dates.format(#dates.createNow(), 'yyyy')}">2026</span>
            </p>
        </div>
    </div>
</div>

<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
