<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="cs">
<head th:replace="~{fragments/layout :: head('Zapomenuté heslo')}"></head>
<body>

<div class="rk-app">
    <div class="rk-auth">
        <div class="rk-auth__card">
            <div class="rk-auth__brand">
                <span style="display:inline-flex; align-items:center; gap:10px;">
                    <img th:src="@{/images/ragnarok-logo.png}" alt="Ragnarok" style="height:40px; width:auto;">
                    Ragnarok
                </span>
                <span class="sub">Obnova hesla</span>
            </div>

            <div class="rk-card">
                <div class="rk-card__body">
                    <h2 style="font-size: var(--fs-h2); margin-bottom: var(--sp-2);">🔑 Zapomněli jste heslo?</h2>
                    <p class="text-muted" style="margin-bottom: var(--sp-5); font-size: var(--fs-sm);">
                        Zadej svůj email a my ti pošleme <strong>6místný kód</strong> pro nastavení nového hesla.
                    </p>

                    <form th:action="@{/forgot-password}" method="post" class="rk-stack-4">
                        <div class="rk-field">
                            <label class="rk-label" for="email">Email</label>
                            <input class="form-control" id="email" name="email" type="email"
                                   placeholder="marek@example.cz" required autocomplete="email" autofocus>
                        </div>
                        <button class="btn btn-accent btn-lg btn-block" type="submit">Poslat kód</button>
                    </form>

                    <hr>
                    <p class="text-center text-muted" style="font-size: var(--fs-sm); margin: 0;">
                        <a th:href="@{/login}" style="color: var(--rk-primary); font-weight: 600;">← Zpět na přihlášení</a>
                    </p>
                </div>
            </div>

            <p class="text-center text-muted" style="font-size: var(--fs-xs); margin-top: var(--sp-4);">
                Ragnarok Training Diary ·
                <span th:text="${#dates.format(#dates.createNow(), 'yyyy')}">2026</span>
            </p>
        </div>
    </div>
</div>

<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
