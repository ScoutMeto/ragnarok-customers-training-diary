<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="cs">
<head th:replace="~{fragments/layout :: head('Plán lekcí')}"></head>
<body class="d-flex flex-column min-vh-100">

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container py-4 flex-grow-1">

    <h1 class="mb-1">Plán lekcí</h1>
    <p class="text-muted mb-4">
        Týden zpět + týden vpřed. Skupinové lekce v tělocvičně, vypsané trenérem.
        Pro rezervaci jdi do
        <a href="#" class="link-secondary">rezervačního systému</a> (přijde ve Fázi 7).
    </p>

    <div th:if="${lessons.isEmpty()}" class="text-center py-5 text-muted">
        <p class="lead mb-0">V tomto týdnu nejsou vypsány žádné lekce.</p>
    </div>

    <div th:unless="${lessons.isEmpty()}" class="row g-3">
        <div th:each="l : ${lessons}" class="col-md-6 col-lg-4">
            <div class="card h-100"
                 th:classappend="${l.lessonDate.isBefore(today)} ? 'opacity-50' : ''">
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-start mb-2">
                        <h5 class="card-title mb-0" th:text="${l.lessonName}">Název</h5>
                        <span class="badge"
                              th:classappend="${l.lessonDate.isBefore(today)} ? 'bg-secondary' :
                                              (${l.lessonDate.isEqual(today)} ? 'bg-success' : 'bg-primary')"
                              th:text="${#temporals.format(l.lessonDate, 'dd.MM.')}">23.05.</span>
                    </div>
                    <p class="text-muted small mb-2">
                        <span th:text="${#temporals.format(l.lessonDate, 'EEEE')}">úterý</span>
                        ·
                        <span th:text="${#temporals.format(l.startTime, 'HH:mm')}">10:00</span>
                        <span th:if="${l.endTime != null}">
                            – <span th:text="${#temporals.format(l.endTime, 'HH:mm')}">11:00</span>
                        </span>
                    </p>
                    <p class="small text-muted mb-2">
                        Trenér: <strong th:text="${l.coach.firstName} + ' ' + ${l.coach.lastName}">Trenér</strong>
                    </p>
                    <p th:if="${l.description != null and !l.description.isEmpty()}"
                       class="mb-0" style="white-space: pre-wrap"
                       th:text="${l.description}">Popis lekce</p>
                </div>
            </div>
        </div>
    </div>

</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<div th:replace="~{fragments/layout :: scripts}"></div>

</body>
</html>
