# =====================================================================
# Ragnarok Customers Training Diary - default configuration (local dev)
# Production overrides: application-prod.properties + SPRING_PROFILES_ACTIVE=prod
# =====================================================================

spring.application.name=ragnarok-customers-training-diary
server.port=8080

# --- PostgreSQL (local dev) ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ragnarok_diary_database}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:Meto1990}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate ---
# ddl-auto=validate -> schema spravuje Flyway, Hibernate jen kontroluje
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# --- Flyway ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# --- Thymeleaf ---
spring.thymeleaf.enabled=true
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.cache=false

# --- Jackson ---
spring.jackson.date-format=dd.MM.yyyy
spring.jackson.time-zone=UTC
spring.jackson.mapper.accept-case-insensitive-enums=true

# --- Actuator (lokálně i v produkci) ---
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized

# --- Tomcat tuning ---
server.tomcat.threads.max=50
server.tomcat.accept-count=50

# --- Logging ---
logging.level.org.hibernate.SQL=INFO
logging.level.org.springframework.security=INFO
