# =====================================================================
# Ragnarok Customers Training Diary - default configuration (local dev)
# Production overrides: application-prod.properties + SPRING_PROFILES_ACTIVE=prod
# =====================================================================

spring.application.name=ragnarok-customers-training-diary
server.port=8080

# --- PostgreSQL (local dev) ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ragnarok_diary_database}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:Meto1990}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate ---
# ddl-auto=validate -> schema spravuje Flyway, Hibernate jen kontroluje
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
# OSIV (Open Session In View) ZAPNUTO záměrně.
# Pro malou synchronní Thymeleaf aplikaci je to pragmatičtější než řešit LazyInitializationException
# přes @EntityGraph na každém query. Trade-off: lazy kolekce se mohou načíst během view rendering,
# což může v budoucnu (Fáze 5 statistiky / vyšší zátěž) vést k N+1 queries. Zrevidovat v Fázi 5.
# Bez OSIV: training.tags / training.exercises.sets v Thymeleaf -> LazyInitializationException.
spring.jpa.open-in-view=true

# --- Flyway ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# --- Thymeleaf ---
spring.thymeleaf.enabled=true
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.cache=false

# --- Jackson ---
spring.jackson.date-format=dd.MM.yyyy
spring.jackson.time-zone=UTC
spring.jackson.mapper.accept-case-insensitive-enums=true

# --- Actuator (lokálně i v produkci) ---
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized

# --- Tomcat tuning ---
server.tomcat.threads.max=50
server.tomcat.accept-count=50

# --- Logging ---
logging.level.org.hibernate.SQL=INFO
logging.level.org.springframework.security=INFO

# =====================================================================
# Phase 6 — Email
# =====================================================================
# Gmail SMTP: vytvoř App Password v Google účtu (Settings → Security → 2-step → App passwords)
# a nastav env vars MAIL_USERNAME (gmail adresa) + MAIL_PASSWORD (16místný app password).
# Pro lokální dev bez SMTP: nastav MAIL_FAKE=true → maily se logují do console místo odesílání.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# Odesílatel + base URL pro odkazy v mailech (např. https://ragnarok.example.com)
ragnarok.mail.from=${MAIL_FROM:noreply@ragnarok-diary.cz}
ragnarok.mail.from-name=${MAIL_FROM_NAME:Ragnarok Training Diary}
ragnarok.mail.base-url=${APP_BASE_URL:http://localhost:8080}
# Když je true, EmailService nepošle nic přes SMTP a jen loguje (užitečné v dev/test).
ragnarok.mail.fake=${MAIL_FAKE:true}
# Cron expression pro reminder skupinových tréninků (default 18:00 každý den).
ragnarok.mail.group-reminder-cron=${MAIL_GROUP_REMINDER_CRON:0 0 18 * * *}

# Confirmation code TTL (minuty)
ragnarok.email-confirmation.code-ttl-minutes=${EMAIL_CONFIRMATION_TTL:60}

# =====================================================================
# Phase 7 — Integrace s rezervačním systémem (REST client)
# =====================================================================
# Base URL rezervačního systému (Java/Spring na Railway). Diary volá jen
# veřejné endpointy: /api/loadAllTrainingsWithoutAuthorization, /api/createNewReservation
ragnarok.reservation.base-url=${RESERVATION_BASE_URL:https://ragnarokcustomersreservationsystem-production.up.railway.app}
ragnarok.reservation.timeout-seconds=${RESERVATION_TIMEOUT:8}
# Připojení vypneme úplně, když je base-url prázdné (např. v testech)
ragnarok.reservation.enabled=${RESERVATION_ENABLED:true}
# Phase 7.2: sdílený klíč pro zrušení rezervace (musí sedět s rez. systémem RAGNAROK_CLIENT_API_KEY)
ragnarok.reservation.api-key=${RESERVATION_API_KEY:}
